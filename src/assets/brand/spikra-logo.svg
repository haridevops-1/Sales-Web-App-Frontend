<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="spikraBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052FF" />
      <stop offset="100%" stop-color="#003087" />
    </linearGradient>
    <linearGradient id="spikraOrangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FF5500" />
    </linearGradient>
  </defs>

  <!-- Spikra Symbol Mark -->
  <g transform="translate(2, 2)">
    <!-- Dark Rounded Emblem Container -->
    <rect width="36" height="36" rx="9" fill="#0B192C" />
    <rect x="0.75" y="0.75" width="34.5" height="34.5" rx="8.25" stroke="#1E2E45" stroke-width="1.5" />
    
    <!-- Dynamic Spikra S-Curve in Royal Blue -->
    <path 
      d="M23 11.5C21 9.5 17 9 14 11C11 13 11.5 16.5 14.5 18L20.5 21C23.5 22.5 24 26 21 28C18 30 14 29.5 12 27.5" 
      stroke="url(#spikraBlueGradient)" 
      stroke-width="3.2" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Spikra Signature Orange Focal Node -->
    <circle cx="23.5" cy="11.5" r="2.8" fill="url(#spikraOrangeGradient)" />
    <!-- Secondary Blue Node -->
    <circle cx="11.5" cy="27.5" r="1.8" fill="#0052FF" />
  </g>

  <!-- Spikra Typography Wordmark -->
  <text x="46" y="26" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="#0B192C" letter-spacing="-0.03em">
    Spikra
  </text>
</svg>
